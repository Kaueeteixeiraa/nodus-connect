services:
  coordination:
    build:
      context: ../..
      dockerfile: Dockerfile.relay
    restart: unless-stopped
    environment:
      PORT: 8787
      NODUS_TURN_URLS: ${NODUS_TURN_URLS:-turn:${PUBLIC_HOST}:3478?transport=udp,turn:${PUBLIC_HOST}:3478?transport=tcp,turn:${PUBLIC_HOST}:443?transport=tcp}
      NODUS_TURN_SECRET: ${TURN_SECRET}
    ports:
      - "8787:8787"

  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --realm=${PUBLIC_HOST}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --external-ip=${PUBLIC_IP}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "443:3478/tcp"
      - "49160-49200:49160-49200/udp"
